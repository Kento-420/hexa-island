<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXA ISLAND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 配置の考え方：スマホ縦1画面。上に席、中央に海と島、下に手札と操作。色は海図の世界ひとつに固定。 */
  --sea-deep:#0d2f45; --sea:#1d6f8f; --foam:#bfe6ea;
  --sand:#f7efdc; --sand-2:#eadfc4; --ink:#17303d; --ink-2:#56707c;
  --coral:#ff6a3d; --teal:#1f9d8f;
  --display:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--sea-deep);color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto}
small{font-size:.72em;font-weight:500}
.muted{color:var(--ink-2)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--pc,#999);border:1.5px solid var(--ink);box-shadow:0 0 0 1.5px #fff;flex:none}

/* タイトル・待合 */
.home{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px;justify-content:center}
.hero{background:radial-gradient(ellipse at center,var(--sea) 0%,var(--sea-deep) 75%);border-radius:20px;padding:6px;max-height:34vh;display:flex}
.hero .board{max-height:32vh}
.card{background:var(--sand);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,9vw,36px);line-height:1.1;margin:0;letter-spacing:.03em;white-space:nowrap;color:var(--sea-deep)}
h2{font-size:18px;font-weight:900;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--ink-2)}
.eyebrow{margin:0;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.08em}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2)}
input{background:#fff;border:2px solid var(--sand-2);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:700;color:var(--ink);min-width:0;width:100%}
input.code{letter-spacing:.3em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--coral);color:#fff}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--ink-2);text-decoration:underline}
.btn.sm{min-height:38px;padding:6px 14px}
.btn:disabled{opacity:.45;box-shadow:none}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}
.note.warn{color:#a23a16;font-weight:700}
.sep{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--ink-2);margin-top:4px}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--sand-2)}
.bigcode{font-family:var(--display);font-size:52px;letter-spacing:.18em;line-height:1;color:var(--sea-deep)}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seats li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}
.seats .rm{margin-left:auto;border:0;background:var(--sand-2);border-radius:8px;width:34px;height:30px;font-size:18px;font-weight:700;color:var(--ink-2)}
.seats .sc{margin-left:auto;font-variant-numeric:tabular-nums}
.pill{font-size:11px;background:var(--sand-2);border-radius:99px;padding:1px 8px;font-weight:700}
.pill.me{background:var(--teal);color:#fff}

/* 対戦画面 */
.game{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.players{display:grid;gap:5px;padding:6px 6px 0}
.players.n2{grid-template-columns:repeat(2,1fr)}.players.n3{grid-template-columns:repeat(3,1fr)}.players.n4{grid-template-columns:repeat(4,1fr)}
.pl{background:var(--sand);border:0;border-top:5px solid var(--pc);border-radius:10px;padding:3px 6px 5px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;opacity:.72;line-height:1.25}
.pl.on{opacity:1;box-shadow:0 0 0 3px var(--coral)}
.pl.me .pn{text-decoration:underline;text-underline-offset:3px}
.pn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font-size:11px;display:flex;align-items:baseline;gap:3px}.pv b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.pv em{font-style:normal;font-size:10px;font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:0 4px}
.ps{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sea{flex:1;min-height:0;position:relative;display:flex;background:radial-gradient(ellipse at center,var(--sea) 0%,var(--sea-deep) 78%)}
.rcode{position:absolute;right:8px;top:6px;font-size:11px;font-weight:700;color:var(--foam);opacity:.8}
.board{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hex{stroke:var(--sand);stroke-width:3;stroke-linejoin:round}
.hic{font-size:19px;text-anchor:middle;dominant-baseline:middle}
.tok{fill:var(--sand);stroke:var(--ink);stroke-width:1.5}
.num{font-family:var(--body);font-weight:900;font-size:15px;text-anchor:middle;fill:var(--ink)}
.num.hot,.pip.hot{fill:#d1261c}.pip{fill:var(--ink)}
.port{fill:var(--sand);stroke:var(--ink);stroke-width:1.5}
.pier{stroke:var(--sand);stroke-width:2.5;stroke-dasharray:3 3;opacity:.85}
.ptx{font-family:var(--body);font-weight:900;font-size:10.5px;text-anchor:middle;fill:var(--ink)}.ptx.s{font-size:7.5px}
.pic{font-size:11px;text-anchor:middle;dominant-baseline:middle}
.robber{fill:#22222c;stroke:#fff;stroke-width:2}
.rdo{stroke:var(--ink);stroke-width:10;stroke-linecap:round}.rd{stroke-width:6;stroke-linecap:round}
.bld{stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.tg{cursor:pointer}
.gh{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2.5;stroke-linejoin:round;opacity:.62;animation:pulse 1.2s ease-in-out infinite}
.tg.sel .gh{opacity:1;stroke:var(--coral);stroke-width:4;stroke-dasharray:none;animation:none}
.ghu{stroke:var(--ink);stroke-width:10;stroke-linecap:round;opacity:.4}
.ghl{stroke-width:6;stroke-linecap:round;opacity:.7;animation:pulse 1.2s ease-in-out infinite}
.tg.sel .ghu{stroke:var(--coral);stroke-width:14;opacity:1}.tg.sel .ghl{opacity:1;animation:none}
.ghd{stroke:var(--ink);stroke-width:1.5;opacity:.75;animation:pulse 1.2s ease-in-out infinite}
.ghup{font-size:11px;text-anchor:middle;fill:#fff;stroke:var(--ink);stroke-width:2.5;paint-order:stroke;font-weight:900;pointer-events:none}
.tg.sel .tgr{stroke:var(--coral);stroke-width:6;stroke-dasharray:none;animation:none}
.tg.sel .robber{opacity:.9}
.tgx{fill:transparent}
.tgd{fill:#fff;fill-opacity:.85;stroke:var(--coral);stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
.tgl{stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-opacity:.85;stroke-dasharray:1 0;animation:pulse 1.2s ease-in-out infinite}
.tgh{fill:#fff;fill-opacity:0}.tgr{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 5;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
/* 開始時にタイルをめくる */
.cov{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:flip .5s ease-in both}
.cov.still{animation:none}
.cov polygon{fill:#17465f;stroke:var(--sand);stroke-width:3;stroke-linejoin:round}
.cov text{font-family:var(--display);font-size:26px;text-anchor:middle;fill:var(--foam);opacity:.55}
@keyframes flip{0%{transform:scaleX(1);opacity:1}70%{transform:scaleX(.03);opacity:1}100%{transform:scaleX(.03);opacity:0}}
/* 収入の演出 */
.fxhex{fill:#fff;fill-opacity:.1;stroke:#fff;stroke-width:6;stroke-linejoin:round;pointer-events:none;animation:fxhex 3.2s ease-out both}
@keyframes fxhex{0%{fill-opacity:.6;stroke-opacity:1}20%{fill-opacity:.1}78%{fill-opacity:.1;stroke-opacity:1}100%{fill-opacity:0;stroke-opacity:0}}
.fxdim{fill:#0d2f45;fill-opacity:0;pointer-events:none;animation:fxdim 3.2s ease-out both}
@keyframes fxdim{0%{fill-opacity:0}8%{fill-opacity:.55}75%{fill-opacity:.55}100%{fill-opacity:0}}
.fxtok{pointer-events:none;transform-box:fill-box;transform-origin:center;opacity:0;animation:fxtok 3.2s ease-out both}
.fxtok circle{fill:var(--coral);stroke:#fff;stroke-width:3}
.fxtok text{font-family:var(--body);font-weight:900;font-size:17px;text-anchor:middle;fill:#fff}
@keyframes fxtok{0%{transform:scale(.6);opacity:0}8%{transform:scale(1.9);opacity:1}18%{transform:scale(1.45);opacity:1}75%{transform:scale(1.45);opacity:1}100%{transform:scale(1);opacity:0}}
.fxfly{pointer-events:none;transform-box:fill-box;transform-origin:center;opacity:0;animation:fxfly 3.2s ease-in-out both}
.fxfly circle{stroke:var(--ink);stroke-width:2}
@keyframes fxfly{0%,14%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}22%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:1}30%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}55%{transform:translate(0,0) scale(1.15);opacity:1}62%{transform:translate(0,0) scale(1)}85%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(0,-12px) scale(1);opacity:0}}
.fxi{font-size:13px;text-anchor:middle;dominant-baseline:middle}
.fxn{font-family:var(--body);font-size:10px;font-weight:900;fill:#fff;stroke:var(--ink);stroke-width:2.5;paint-order:stroke}
.rollpop{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--sand);border:2px solid var(--ink);border-radius:14px;padding:3px 14px;font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center;white-space:nowrap;pointer-events:none;animation:pop 3.2s ease-out both}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}10%{opacity:1;transform:translateX(-50%) scale(1.12)}18%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.pg{font-size:11.5px;font-weight:900;background:var(--teal);color:#fff;border-radius:6px;padding:0 5px;white-space:nowrap;max-width:100%;overflow:hidden;animation:pg 3.2s both}
@keyframes pg{0%{transform:scale(.6)}12%{transform:scale(1.12)}22%{transform:scale(1)}100%{transform:scale(1)}}
.rc{position:relative}
.rc.up{box-shadow:0 0 0 3px var(--teal);animation:rcup 1.7s both}
@keyframes rcup{0%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}100%{transform:scale(1)}}
.rc .plus{position:absolute;top:-13px;right:-3px;background:var(--teal);color:#fff;font-style:normal;font-weight:900;font-size:13px;line-height:1.4;border-radius:99px;padding:0 7px;animation:plus 1.7s both}
@keyframes plus{0%{transform:translateY(8px);opacity:0}15%{transform:translateY(0);opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cov{animation:none}.fxhex,.fxdim,.rollpop,.pg,.rc.up,.rc .plus{animation:none}.fxtok,.fxfly{animation:none;opacity:1}.fxtok{transform:scale(1.45)}.fxdim{fill-opacity:.5}}
@media (prefers-reduced-motion:reduce){.tgd,.tgl,.tgr,.gh,.ghl,.ghd{animation:none}}
.netbar{background:#a23a16;color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;text-align:center;margin-top:5px}
.status{background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;padding:7px 12px;display:flex;align-items:center;gap:10px;min-height:38px}
.status.mine{background:var(--coral)}
.status.cf{padding:5px 8px 5px 12px;min-height:46px}.status.cf span{flex:1;font-size:14.5px}.status.cf small{font-size:13px;margin-left:4px}
.okb,.nob{border:2px solid var(--ink);border-radius:10px;min-height:36px;padding:0 14px;font-weight:900;font-size:14.5px;box-shadow:0 2px 0 var(--ink)}
.okb{background:#fff;color:var(--ink);min-width:74px}.nob{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);box-shadow:none;font-weight:700;padding:0 10px}
.dice{display:flex;gap:4px}.dice b{background:#fff;color:var(--ink);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;font-weight:900}
.hand{background:var(--sand);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 8px 4px}
.rc{background:#fff;border-radius:10px;padding:3px 4px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:17px}
.rc b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;min-width:1ch}.rc small{color:var(--ink-2)}
.rc.z{opacity:.45}
.acts{background:var(--sand);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.ab{border:2px solid var(--ink);background:#fff;border-radius:11px;min-height:48px;padding:3px 2px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:0 2px 0 var(--ink)}
.ab small{font-size:11px;letter-spacing:-.05em}
.ab:disabled{opacity:.4;box-shadow:none}
.ab.pri{background:var(--coral);color:#fff}.ab.sel{background:var(--ink);color:#fff}
.ab.wide{grid-column:span 2;font-size:15px}
.ab.bld2{min-height:66px;gap:0;padding:2px}.ab.bld2 .pi{width:30px;height:26px}.ab.bld2 span{display:flex;align-items:baseline;gap:3px}.ab.bld2 i{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-2)}
.ab.bld2.off{opacity:.5;box-shadow:none}.ab.bld2.off .pi{filter:grayscale(1)}.ab.bld2 .lk{color:#a23a16;font-weight:900}
.ab.bld2.sel i,.ab.bld2.sel .lk{color:#fff}
.scrim{position:absolute;inset:0;background:rgba(9,30,44,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--sand);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.x{position:absolute;right:10px;top:8px;width:40px;height:40px;border:0;background:transparent;font-size:24px;color:var(--ink-2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sand-2);border-radius:12px;padding:3px;margin-right:40px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px;font-weight:700;color:var(--ink-2)}.tabs .on{background:#fff;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick button{border:2px solid var(--sand-2);background:#fff;border-radius:12px;min-height:60px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pick button small{font-size:11px;font-weight:700}.pick button .rt{font-weight:500;color:var(--ink-2);font-size:10px}
.mh{display:flex;align-items:center;gap:6px;background:var(--sand-2);border-radius:10px;padding:5px 10px;font-size:15px}
.mh span{font-size:11px;font-weight:700;color:var(--ink-2);margin-right:auto}.mh b{font-weight:900;font-variant-numeric:tabular-nums}.mh .z{opacity:.4}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sand-2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px;font-weight:700;color:var(--ink-2);min-height:40px}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.pick .on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}.pick button:disabled{opacity:.35}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stp{background:#fff;border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:17px}
.stp span{display:flex;align-items:baseline;gap:2px}.stp b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.stp button{width:100%;max-width:48px;height:36px;border:2px solid var(--ink);background:var(--sand);border-radius:9px;font-weight:900;font-size:16px}
.stp button:disabled{opacity:.3}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deal div{background:#fff;border-radius:12px;padding:8px 10px;font-size:18px}.deal small{display:block;font-size:11px;font-weight:700;color:var(--ink-2)}
.ctr{display:flex;flex-direction:column;gap:6px;border:2px solid var(--teal);border-radius:14px;padding:8px}.ctr .deal div{background:var(--sand-2)}
.wait{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.wait span{margin-left:auto;font-size:12px;color:var(--ink-2)}
.dv{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px}.dv div{flex:1;display:flex;flex-direction:column}.dv small{color:var(--ink-2);font-size:12px}
.log{margin:0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;max-height:38vh;overflow:auto}
.log li{padding:4px 8px;background:#fff;border-radius:8px}
.cost{width:100%;border-collapse:collapse;font-size:14px}.cost th{text-align:left;font-weight:700;padding:6px 4px}.cost td{padding:6px 4px;border-top:1.5px solid var(--sand-2)}.cost th{border-top:1.5px solid var(--sand-2)}.cost tr:first-child>*{border-top:0}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-8px);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;width:max-content;text-align:center;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="peerjs.min.js"></script>
<script>
// HEXA ISLAND ルールエンジン（六角タイルの開拓ゲーム・3〜4人の基本ルール）
// 状態 S はただの JSON。apply(S, seat, action) が S を書き換え、{ok:true} か {err:'理由'} を返す。
(function (root) {
  'use strict';
  const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const RES_JA = { wood: '木', brick: '土', sheep: '羊', wheat: '麦', ore: '鉄' };
  const DEV_JA = { knight: '騎士', road: '街道建設', plenty: '豊作', mono: '独占', vp: '勝利点' };
  const COST = {
    road: { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
    city: { wheat: 2, ore: 3 },
    dev: { sheep: 1, wheat: 1, ore: 1 },
  };
  const WIN = 10;
  const zero = () => ({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 });
  const total = (h) => RES.reduce((s, r) => s + (h[r] || 0), 0);

  // ---------- 盤の形（全員共通・固定） ----------
  const G = (function () {
    const SZ = 50, hexes = [], verts = [], edges = [], vmap = {}, emap = {};
    for (let r = -2; r <= 2; r++) for (let q = -2; q <= 2; q++) {
      if (Math.abs(q + r) > 2) continue;
      hexes.push({ q, r, x: SZ * Math.sqrt(3) * (q + r / 2), y: SZ * 1.5 * r, v: [], e: [] });
    }
    hexes.forEach((h, hi) => {
      for (let i = 0; i < 6; i++) {
        const ang = Math.PI / 180 * (60 * i - 30);

      case 'offer': if (act({ t: 'offerTrade', give: clone(ui.give), want: clone(ui.want) })) { ui.sheet = null; render(); } break;
      case 'dev':
        if (i === 'plenty' || i === 'mono') { ui.sheet = i; ui.pick = []; render(); }
        else { ui.sheet = null; if (!act({ t: 'playDev', card: i })) render(); }
        break;
      case 'pk':
        if (ui.sheet === 'mono') { ui.sheet = null; if (!act({ t: 'playDev', card: 'mono', res: i })) render(); }
        else if (ui.pick.length < 2) { ui.pick.push(i); render(); }
        break;
      case 'pkclr': ui.pick = []; render(); break;
      case 'pkgo': { const pk = ui.pick; ui.sheet = null; ui.pick = []; if (!act({ t: 'playDev', card: 'plenty', a: pk[0], b: pk[1] })) render(); break; }
    }
  });

  // ---------- 起動 ----------
  render();
  (async function () {
    try {
      store = await makeDbStore();
      if (!store && !hasPeer && isLocalhost && !window.claude) store = makeMemStore();
    } catch (e) { store = null; }
    net = store ? 'on' : hasPeer ? 'peer' : 'off';
    if (screen === 'home') render();
  })();
  if (isLocalhost) window.__shima = { get S() { return S; }, get room() { return room; }, get me() { return me; } };
})();

</script>
